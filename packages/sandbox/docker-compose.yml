# GUS topology — canonical Docker form (real hosts).
#
# The security story in one file:
# - agent-sandbox has NO network (network_mode: none). Its only bridge to
#   the world is the unix socket on the comm volume, which leads to the
#   control plane — never to the internet, never to a model, never to a
#   secret. Since Phase 1 the sandbox's fetches are executed BY the
#   control plane's egress proxy (allowlist + vault injection + response
#   screening) and the screened result is relayed back over the socket:
#   the sandbox's only network path is the proxy, and it is a relay, not
#   a route.
# - control-plane holds all state (ledger/jobs/receipts/kill flag) on its
#   own volume the sandbox cannot see, and is the only process that talks
#   to channels and (in later phases) providers.
# - Since Phase 3 both services boot through the slot launcher
#   (packages/sandbox/launcher.mjs): the versioned code lives in A/B
#   slots on the gus-install volume, the pointer there names the live
#   slot, and the Updater (control plane) stages, verifies, canaries,
#   and flips — or rolls back — without ever mutating the running slot.
#   The install volume is mounted READ-ONLY into the sandbox: the
#   runtime can execute its slot but can never update itself.
# - Both run under the resource budget from the spec (§0 rule 4):
#   governor + vault + one sandbox steady-state <= 1 GB RAM.
services:
  control-plane:
    build:
      context: ../..
      dockerfile: packages/sandbox/Dockerfile.control
    image: gus-control:dev
    entrypoint: ["node", "/app/launcher.mjs", "control"]
    environment:
      GUS_CHANNEL: ${GUS_CHANNEL:-fake-file}
      GUS_FAKE_INBOUND: /run/gus/inbound.ndjson
      GUS_FAKE_OUTBOUND: /run/gus/outbound.ndjson
      GUS_TELEGRAM_BOT_TOKEN: ${GUS_TELEGRAM_BOT_TOKEN:-}
      # Phase 1: Vault Broker + egress proxy (control-plane side only).
      # The vault store + host key live in /state, which the sandbox
      # cannot see. A missing egress-policy.json is a deny-all policy.
      GUS_VAULT_KEY_FILE: /state/vault.key
      GUS_EGRESS_POLICY: /state/egress-policy.json
      # Phase 3: Updater. The launcher seeds /install from the image's
      # bundled slot on first boot; releases are read from
      # /state/releases/<version>/ and verified against the pinned key.
      GUS_INSTALL_DIR: /install
      # Phase 4: the operator panel. It binds 0.0.0.0 INSIDE the
      # container so the published port works; the publish itself is
      # loopback-only on the host — reaching the panel from another
      # machine is an explicit operator choice (SSH tunnel), never a
      # default. The operator token lives in /state (0600).
      GUS_PANEL_HOST: 0.0.0.0
      GUS_PANEL_PORT: 8731
    ports:
      - "127.0.0.1:8731:8731"
    volumes:
      - gus-state:/state
      - gus-comm:/comm
      - gus-run:/run/gus
      - gus-install:/install
    mem_limit: 256m
    cpus: 1.0
    restart: "no"

  agent-sandbox:
    build:
      context: ../..
      dockerfile: packages/sandbox/Dockerfile.agent
    image: gus-agent:dev
    entrypoint: ["node", "/app/launcher.mjs", "sandbox"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    environment:
      GUS_INSTALL_DIR: /install
      GUS_COMM_DIR: /comm
    volumes:
      - gus-comm:/comm
      - gus-workspace:/workspace
      - gus-install:/install:ro
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    depends_on:
      - control-plane

volumes:
  gus-state:
  gus-comm:
  gus-workspace:
  gus-run:
  gus-install:
