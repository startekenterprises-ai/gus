# GUS log rotation for the Mac resident install (Phase 7).
#
# launchd does not rotate logs; newsyslog does. Render the state dir
# into this file and install it (one sudo step, by hand, on purpose):
#
#   sed "s|__STATE_DIR__|$HOME/.gus/state|g" hosts/mac-resident/newsyslog-gus.conf \
#     | sudo tee /etc/newsyslog.d/gus.conf >/dev/null
#
# Format: logfile  mode  count  size(KB)  when  flags — keep 5 files
# of ~10 MB, compress the rotated ones. The agents keep appending to
# the live file; newsyslog creates its replacement (no signal needed
# for append-only writers beyond the create flag's default behavior).
__STATE_DIR__/logs/control-plane.log  644  5  10240  *  Z
__STATE_DIR__/logs/runtime.log        644  5  10240  *  Z
